<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>更新智援臺北</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5fb; color: #16304d; font: 16px system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>正在更新畫面</h1>
    <p id="status">清除舊版快取後，將自動開啟最新版本。</p>
  </main>
  <script>
    (async function () {
      const appBase = new URL('./', window.location.href);
      const isThisAppScope = (registration) => {
        try {
          return new URL(registration.scope).pathname.startsWith(appBase.pathname);
        } catch (_) {
          return false;
        }
      };
      const jobs = [];
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          jobs.push(...registrations.filter(isThisAppScope).map((registration) => registration.unregister()));
        }
      } catch (_) {}
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          const flutterCaches = keys.filter((key) => /^flutter-(app|temp|app-manifest)/i.test(key));
          jobs.push(...flutterCaches.map((key) => caches.delete(key)));
        }
      } catch (_) {}
      await Promise.race([
        Promise.allSettled(jobs),
        new Promise((resolve) => window.setTimeout(resolve, 2500))
      ]);
      const latest = new URL('./', window.location.href);
      latest.searchParams.set('_refresh', Date.now().toString());
      window.location.replace(latest.href);
    })();
  </script>
</body>
</html>
