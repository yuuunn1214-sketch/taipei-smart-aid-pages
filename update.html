<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>更新智援臺北</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f1f5fb; color: #16304d; font: 16px system-ui, sans-serif; }
    main { text-align: center; padding: 24px; }
  </style>
</head>
<body>
  <main>
    <h1>正在更新畫面</h1>
    <p>解除舊版 App 快取後，將自動開啟最新版本。</p>
  </main>
  <script>
    (async function () {
      const appPath = new URL('./', window.location.href).pathname;
      const belongsToThisApp = (registration) => {
        try {
          const scope = new URL(registration.scope);
          return scope.origin === window.location.origin &&
            (scope.pathname === '/' || scope.pathname.startsWith(appPath));
        } catch (_) {
          return false;
        }
      };
      const jobs = [];
      try {
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          jobs.push(...registrations
            .filter(belongsToThisApp)
            .map((registration) => registration.unregister()));
        }
      } catch (_) {}
      try {
        if ('caches' in window) {
          const keys = await caches.keys();
          jobs.push(...keys
            .filter((key) => /^flutter-(app|temp|app-manifest)/i.test(key))
            .map((key) => caches.delete(key)));
        }
      } catch (_) {}
      await Promise.race([
        Promise.allSettled(jobs),
        new Promise((resolve) => window.setTimeout(resolve, 4000))
      ]);
      const latest = new URL('./', window.location.href);
      latest.searchParams.set('_refresh', Date.now().toString());
      window.location.replace(latest.href);
    })();
  </script>
</body>
</html>
