<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/taipei-smart-aid-pages/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="智援臺北：淹水風險、災情通報、物資調度與志工協作平台。">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="智援臺北">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>智援臺北</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    // Remove an older Flutter offline worker before starting the app. Old
    // workers can keep showing a previous release on mobile browsers.
    (async function () {
      if (sessionStorage.getItem('smart-aid-cache-reset')) {
        sessionStorage.removeItem('smart-aid-cache-reset');
        var cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.delete('_refresh');
        window.history.replaceState(null, '', cleanUrl.toString());
      }
      var registrations = 'serviceWorker' in navigator
        ? await navigator.serviceWorker.getRegistrations()
        : [];
      var cacheKeys = 'caches' in window ? await caches.keys() : [];
      if (registrations.length || cacheKeys.length) {
        await Promise.all(registrations.map(function (registration) {
          return registration.unregister();
        }));
        await Promise.all(cacheKeys.map(function (key) {
          return caches.delete(key);
        }));

        // Start a fresh, network-loaded document once after removing a worker.
        if (registrations.length && !sessionStorage.getItem('smart-aid-cache-reset')) {
          sessionStorage.setItem('smart-aid-cache-reset', '1');
          var freshUrl = new URL(window.location.href);
          freshUrl.searchParams.set('_refresh', Date.now().toString());
          window.location.replace(freshUrl.toString());
          return;
        }
      }

      var bootstrap = document.createElement('script');
      bootstrap.src = 'flutter_bootstrap.js?v=' + Date.now();
      bootstrap.async = true;
      document.body.appendChild(bootstrap);
    })();
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
</body>
</html>
